services:
  gympass_api:
    container_name: "gympass_api"
    restart: "always"
    image: gympass-api
    user: root
    working_dir: /app
    environment:
      - NODE_ENV=production
    volumes:
      - ./:/app
    expose:
      - 3333
    ports:
      - 3333:3333
    env_file:
      - /etc/environment
    command: "/app/docker/api/start.sh"
